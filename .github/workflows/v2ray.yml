name: V2Ray on Actions (IPv6)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'start یا stop را انتخاب کن'
        required: true
        type: choice
        options:
          - start
          - stop
        default: 'start'

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # حداکثر ۶ ساعت برای اجرای start

    steps:
      - name: توقف همه اجراهای در حال کار
        if: github.event.inputs.action == 'stop'
        run: |
          echo "در حال توقف workflowهای فعال روی این شاخه..."
          RUN_ID=${{ github.run_id }}
          gh run list --workflow="${{ github.workflow }}" --branch="${{ github.ref_name }}" --status in_progress --json databaseId -q '.[].databaseId' | while read id; do
            if [ "$id" != "$RUN_ID" ]; then
              echo "لغو اجرای $id"
              gh run cancel $id
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: راه‌اندازی V2Ray و دریافت IPv6
        if: github.event.inputs.action == 'start'
        run: |
          echo "1. نصب Xray-core"
          sudo apt-get update && sudo apt-get install -y wget unzip curl
          wget -O xray.zip https://github.com/XTLS/Xray-core/releases/download/v1.8.1/Xray-linux-64.zip
          unzip xray.zip && chmod +x xray
          sudo mv xray /usr/local/bin/xray

          echo "2. ساخت فایل پیکربندی"
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID تولید شده: $UUID"
          cat << EOF | sudo tee /etc/xray_config.json
          {
            "inbounds": [{
              "port": 443,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "$UUID" }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": { "mode": "packet-up", "path": "/" }
              }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF

          echo "3. دریافت آدرس IPv6 عمومی رانر"
          IPV6=$(ip -6 addr show scope global | grep inet6 | awk '{print $2}' | cut -d/ -f1 | head -1)
          if [ -z "$IPV6" ]; then
            echo "❌ هیچ آدرس IPv6 عمومی پیدا نشد. این روش روی این رانر جواب نمی‌دهد."
            exit 1
          fi
          echo "آدرس IPv6 سرور: $IPV6"

          echo "4. اجرای Xray در پس‌زمینه"
          sudo /usr/local/bin/xray -c /etc/xray_config.json &

          echo "5. ساخت لینک VLESS"
          VLESS_LINK="vless://${UUID}@[${IPV6}]:443?encryption=none&security=none&type=xhttp&mode=packet-up&path=%2F#G2ray-Actions-IPv6"
          echo "✅ لینک اتصال:"
          echo "$VLESS_LINK"
          echo "$VLESS_LINK" > vless_link.txt

          echo "پروکسی در حال اجراست. برای توقف، workflow را با action=stop اجرا کنید."
          while true; do sleep 60; done

      - name: آپلود فایل کانفیگ
        if: github.event.inputs.action == 'start'
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-config
          path: vless_link.txt
